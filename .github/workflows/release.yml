name: release
# Creates a GitHub release on every push to main (i.e. every merged pull request from dev).
# Version: <VERSION file>.<run number>, e.g. v0.1.7. Versions starting with "0." are pre-releases.
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  native-plugins:
    uses: ./.github/workflows/film-effects-plugins.yml
    secrets: inherit
  resolve-plugin:
    uses: ./.github/workflows/film-effects-ofx.yml
  release:
    needs: [native-plugins, resolve-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: version
        run: |
          base=$(tr -d ' \n\r' < VERSION)
          echo "tag=v${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          if [[ "$base" == 0.* ]]; then echo "pre=--prerelease" >> "$GITHUB_OUTPUT"; else echo "pre=" >> "$GITHUB_OUTPUT"; fi
      - name: Build and test Track Range Exporter
        working-directory: plugins/track-range-exporter
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Test Film Effects core
        working-directory: plugins/film-effects
        run: ./scripts/run-core-tests.sh
      - name: Package installers (.ccx)
        run: |
          tag=${{ steps.version.outputs.tag }}
          plugins/track-range-exporter/scripts/package-ccx.sh "$PWD/out" "-${tag}" "${tag#v}"
      - name: Download Film Effects Mac installer
        uses: actions/download-artifact@v4
        with:
          name: FilmEffects-mac-installer
          path: out
      - name: Download Film Effects Windows build
        uses: actions/download-artifact@v4
        with:
          name: FilmEffects-win
          path: native-win
      - name: Download Film Effects Windows CUDA build
        uses: actions/download-artifact@v4
        with:
          name: FilmEffects-win-cuda
          path: native-win-cuda
      - name: Download Film Effects Windows installer
        uses: actions/download-artifact@v4
        with:
          name: FilmEffects-windows-installer
          path: out
      - name: Download Film Effects for DaVinci Resolve
        uses: actions/download-artifact@v4
        with:
          pattern: FilmEffects-Resolve-*
          path: out
          merge-multiple: true
      - name: Name native release downloads
        run: |
          tag=${{ steps.version.outputs.tag }}
          mv out/FilmEffects-mac.pkg "out/FilmEffects-Premiere-mac-${tag}.pkg"
          mv out/FilmEffects-Windows-Setup.exe "out/FilmEffects-Premiere-Windows-Setup-${tag}.exe"
          mv out/FilmEffects-Resolve-mac.pkg "out/FilmEffects-Resolve-mac-${tag}.pkg"
          mv out/FilmEffects-Resolve-Windows-Setup.exe "out/FilmEffects-Resolve-Windows-Setup-${tag}.exe"
          mv out/FilmEffects-Resolve-linux.tar.gz "out/FilmEffects-Resolve-linux-${tag}.tar.gz"
          cp LICENSE native-win/LICENSE.txt
          (cd native-win && zip -r "../out/FilmEffects-Premiere-Windows-CPU-experimental-${tag}.zip" .)
          cp LICENSE native-win-cuda/LICENSE.txt
          (cd native-win-cuda && zip -r "../out/FilmEffects-Premiere-Windows-CUDA-experimental-${tag}.zip" .)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.version.outputs.tag }}
          cat > notes.md <<NOTES
          Free plugins for Adobe Premiere Pro by Venosta Visuals — https://venostavisuals.com
          Provided "as is", without any warranty. Keep backups of your projects.

          ### Track Range Exporter (Windows + macOS)
          - \`TrackRangeExporter-Premiere-${tag}.ccx\`: **double-click** to install with Creative Cloud Desktop, restart Premiere, then Window → UXP Plugins → Track Range Exporter.
          - \`TrackRangeExporter-MediaEncoder-${tag}.ccx\`: optional companion panel for Adobe Media Encoder 27+ (only needed for the "no timeline change" queue method).
          - Uninstall: Creative Cloud Desktop → Plugins → Manage Plugins.

          ### Film Effects for Premiere Pro
          - \`FilmEffects-Premiere-mac-${tag}.pkg\`: quit Premiere, double-click to install, then restart Premiere. Includes Film Effects, Film Bloom, Film Halation and Film Grain under Video Effects → Venosta Visuals.
          - Mac: macOS 26+, Apple Silicon + Intel. User-tested in Premiere Pro 27 on an Apple Silicon Mac. Installer is unsigned, bundles are ad hoc signed, and this release is not Apple-notarized.
          - \`FilmEffects-Premiere-Windows-Setup-${tag}.exe\`: **recommended for Windows.** Double-click, confirm the admin prompt, finish the wizard, restart Premiere. Picks the NVIDIA CUDA build automatically when an NVIDIA driver is installed (CPU-only otherwise; you can change it). Uninstall via Settings → Apps. The installer is not code-signed, so Windows SmartScreen may warn: click "More info" → "Run anyway". Windows host behavior is unverified.
          - The two zips below contain the same plugins for manual installation:
          - \`FilmEffects-Premiere-Windows-CPU-experimental-${tag}.zip\`: CPU-only build (manual); extract and run install-windows.ps1. Windows host behavior is unverified.
          - \`FilmEffects-Premiere-Windows-CUDA-experimental-${tag}.zip\`: CPU + NVIDIA CUDA build; install this OR the CPU build. Includes a statically linked CUDA runtime; needs a compatible NVIDIA GPU and driver, not the CUDA Toolkit. CUDA execution and Premiere behavior on Windows await hardware testing.
          ### Film Effects for DaVinci Resolve (OpenFX) — experimental
          - \`FilmEffects-Resolve-Windows-Setup-${tag}.exe\`, \`FilmEffects-Resolve-mac-${tag}.pkg\` (macOS 12+, Apple Silicon + Intel), \`FilmEffects-Resolve-linux-${tag}.tar.gz\` (extract the bundle into /usr/OFX/Plugins). Same four effects, in Resolve's Effects library under OpenFX → Venosta Visuals.
          - GPU rendering: **Metal** on macOS, **NVIDIA CUDA** on Windows (includes GTX 1080 / Pascal code; needs an NVIDIA driver, not the CUDA Toolkit), CPU fallback otherwise and on Linux — one download per system, no separate CUDA/CPU versions. Resolve chooses: CUDA when Preferences → Memory and GPU is set to CUDA, otherwise CPU. Built and load-tested in CI, GPU maths checked against the CPU reference in CI; user-tested in DaVinci Resolve on macOS; Windows and Linux not yet tested in Resolve. Installers are unsigned: allow them in System Settings → Privacy & Security (Mac) / confirm the Windows warning.

          ### Film Effects (all hosts)
          - CPU tests and Metal GPU comparisons are automated. Export matching, long timeline stability, HDR workflows and measured playback performance remain unverified. No Adobe SDK files are included.

          Status of each plugin: see the README and each plugin's PROGRESS.md.
          NOTES
          gh release create "$tag" out/*.ccx out/*.pkg out/*.exe out/*.zip out/*.tar.gz --target "$GITHUB_SHA" --title "$tag" \
            --notes-file notes.md --generate-notes ${{ steps.version.outputs.pre }}
