name: release
# Creates a GitHub release on every push to main (i.e. every merged pull request from dev).
# Version: <VERSION file>.<run number>, e.g. v0.1.7. Versions starting with "0." are pre-releases.
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # Every effect plugin: Premiere + Resolve builds, tests and installers (shared workflows).
  film-effects:
    uses: ./.github/workflows/film-effects.yml
    secrets: inherit
  lens-diffusion:
    uses: ./.github/workflows/lens-diffusion.yml
    secrets: inherit
  exposure-false-color:
    uses: ./.github/workflows/exposure-false-color.yml
    secrets: inherit
  retro:
    uses: ./.github/workflows/retro.yml
    secrets: inherit
  release:
    needs: [film-effects, lens-diffusion, exposure-false-color, retro]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: version
        run: |
          base=$(tr -d ' \n\r' < VERSION)
          echo "tag=v${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          if [[ "$base" == 0.* ]]; then echo "pre=--prerelease" >> "$GITHUB_OUTPUT"; else echo "pre=" >> "$GITHUB_OUTPUT"; fi
      - name: Build and test Track Range Exporter
        working-directory: plugins/track-range-exporter
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Test Film Effects core
        working-directory: plugins/film-effects
        run: ./scripts/run-core-tests.sh
      - name: Package installers (.ccx)
        run: |
          tag=${{ steps.version.outputs.tag }}
          plugins/track-range-exporter/scripts/package-ccx.sh "$PWD/out" "-${tag}" "${tag#v}"
      - name: Download all plugin installers
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Add the version to the file names
        run: |
          tag=${{ steps.version.outputs.tag }}
          cd out
          for f in *.pkg *.exe; do [ -e "$f" ] && mv "$f" "${f%.*}-${tag}.${f##*.}"; done
          for f in *.tar.gz; do [ -e "$f" ] && mv "$f" "${f%.tar.gz}-${tag}.tar.gz"; done
          ls -l
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.version.outputs.tag }}
          .github/scripts/release-notes.sh "$tag" out > notes.md
          cat notes.md
          gh release create "$tag" out/*.ccx out/*.pkg out/*.exe out/*.tar.gz --target "$GITHUB_SHA" --title "$tag" \
            --notes-file notes.md --generate-notes ${{ steps.version.outputs.pre }}
