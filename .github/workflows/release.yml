name: release
# Creates a GitHub release on every push to main (i.e. every merged pull request from dev).
# Version: <VERSION file>.<run number>, e.g. v0.1.7. Versions starting with "0." are pre-releases.
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # Every effect plugin: Premiere + Resolve builds, tests and installers (shared workflows).
  film-effects:
    uses: ./.github/workflows/film-effects.yml
    secrets: inherit
  lens-diffusion:
    uses: ./.github/workflows/lens-diffusion.yml
    secrets: inherit
  release:
    needs: [film-effects, lens-diffusion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: version
        run: |
          base=$(tr -d ' \n\r' < VERSION)
          echo "tag=v${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          if [[ "$base" == 0.* ]]; then echo "pre=--prerelease" >> "$GITHUB_OUTPUT"; else echo "pre=" >> "$GITHUB_OUTPUT"; fi
      - name: Build and test Track Range Exporter
        working-directory: plugins/track-range-exporter
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Test Film Effects core
        working-directory: plugins/film-effects
        run: ./scripts/run-core-tests.sh
      - name: Package installers (.ccx)
        run: |
          tag=${{ steps.version.outputs.tag }}
          plugins/track-range-exporter/scripts/package-ccx.sh "$PWD/out" "-${tag}" "${tag#v}"
      - name: Download all plugin installers
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Add the version to the file names
        run: |
          tag=${{ steps.version.outputs.tag }}
          cd out
          for f in *.pkg *.exe; do [ -e "$f" ] && mv "$f" "${f%.*}-${tag}.${f##*.}"; done
          for f in *.tar.gz; do [ -e "$f" ] && mv "$f" "${f%.tar.gz}-${tag}.tar.gz"; done
          ls -l
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.version.outputs.tag }}
          cat > notes.md <<NOTES
          Free plugins for Adobe Premiere Pro by Venosta Visuals — https://venostavisuals.com
          Provided "as is", without any warranty. Keep backups of your projects.

          ### Track Range Exporter (Windows + macOS)
          - \`TrackRangeExporter-Premiere-${tag}.ccx\`: **double-click** to install with Creative Cloud Desktop, restart Premiere, then Window → UXP Plugins → Track Range Exporter.
          - \`TrackRangeExporter-MediaEncoder-${tag}.ccx\`: optional companion panel for Adobe Media Encoder 27+ (only needed for the "no timeline change" queue method).
          - Uninstall: Creative Cloud Desktop → Plugins → Manage Plugins.

          ### Film Effects for Premiere Pro
          - \`FilmEffects-Premiere-mac-${tag}.pkg\`: quit Premiere, double-click to install, then restart Premiere. Installs Film Effects under Video Effects → Venosta Visuals (the former standalone Film Bloom / Halation / Grain are part of it now and are removed on upgrade).
          - Mac: macOS 26+, Apple Silicon + Intel. User-tested in Premiere Pro 27 on an Apple Silicon Mac. Installer is unsigned, bundles are ad hoc signed, and this release is not Apple-notarized.
          - \`FilmEffects-Premiere-Windows-Setup-${tag}.exe\`: double-click, confirm the admin prompt, finish the wizard, restart Premiere. One build for every PC: renders with NVIDIA CUDA when the project uses Mercury Playback Engine GPU (CUDA), otherwise on the CPU (needs an NVIDIA driver for CUDA, not the CUDA Toolkit; includes GTX 1080 / Pascal code). On Windows on Arm (Premiere 26+) it installs a native ARM64 build instead (CPU only, untested in Premiere). Uninstall via Settings → Apps. Not code-signed: Windows may warn — "More info" → "Run anyway". Windows host behavior is unverified.
          ### Lens & Diffusion — new, experimental
          - \`LensDiffusion-Premiere-mac-${tag}.pkg\`, \`LensDiffusion-Premiere-Windows-Setup-${tag}.exe\` (Premiere Pro) and \`LensDiffusion-Resolve-…\` (DaVinci Resolve: Windows, macOS, Linux). One effect, **Lens & Diffusion**, under Venosta Visuals: diffusion filter (mist to black-mist look), vignette, chromatic aberration, anamorphic streaks, presets.
          - GPU rendering with Metal (macOS) and NVIDIA CUDA (Windows), CPU otherwise. Built, loaded and installer-tested in CI, GPU maths checked against the CPU reference; **not yet tested inside Premiere or Resolve**.

          ### Film Effects for DaVinci Resolve (OpenFX) — experimental
          - \`FilmEffects-Resolve-Windows-Setup-${tag}.exe\`, \`FilmEffects-Resolve-mac-${tag}.pkg\` (macOS 12+, Apple Silicon + Intel), \`FilmEffects-Resolve-linux-${tag}.tar.gz\` (extract the bundle into /usr/OFX/Plugins). The Windows Setup covers x64 PCs and Windows on Arm (native Arm64EC build, CPU only, untested in Resolve). Film Effects appears in Resolve's Effects library under OpenFX → Venosta Visuals.
          - GPU rendering: **Metal** on macOS, **NVIDIA CUDA** on Windows (includes GTX 1080 / Pascal code; needs an NVIDIA driver, not the CUDA Toolkit), CPU fallback otherwise and on Linux — one download per system, no separate CUDA/CPU versions. Resolve chooses: CUDA when Preferences → Memory and GPU is set to CUDA, otherwise CPU. Built and load-tested in CI, GPU maths checked against the CPU reference in CI; user-tested in DaVinci Resolve on macOS; Windows and Linux not yet tested in Resolve. Installers are unsigned: allow them in System Settings → Privacy & Security (Mac) / confirm the Windows warning.

          ### Film Effects (all hosts)
          - CPU tests and Metal GPU comparisons are automated. Export matching, long timeline stability, HDR workflows and measured playback performance remain unverified. No Adobe SDK files are included.

          Status of each plugin: see the README and each plugin's PROGRESS.md.
          NOTES
          gh release create "$tag" out/*.ccx out/*.pkg out/*.exe out/*.tar.gz --target "$GITHUB_SHA" --title "$tag" \
            --notes-file notes.md --generate-notes ${{ steps.version.outputs.pre }}
