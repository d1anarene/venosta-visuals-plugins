name: film-effects-ofx
# Builds the Film Effects OpenFX plug-in for DaVinci Resolve (macOS universal, Windows x64,
# Linux x86-64). Needs no Adobe SDK: the BSD-licensed OpenFX SDK is fetched at configure time.
# Checks: core tests, loading the bundle like an OFX host, and (Windows) a silent install and
# uninstall of the Setup. Not a test inside DaVinci Resolve.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  ofx:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          # CUDA 12.x supports VS 2022; avoid the rolling runner's newer VS toolchain.
          - os: windows-2022
            platform: windows
          # Resolve on Windows on Arm is an Arm64EC host (OpenFX 1.5 packaging): native Arm64EC
          # build in Contents/Win-arm64ec, CPU only. Built and load-tested on an Arm machine.
          - os: windows-11-arm
            platform: windows-arm64ec
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: plugins/film-effects
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "FE_VERSION=$(tr -d ' \n\r' < ../../VERSION).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Install CUDA compiler (Windows)
        if: matrix.platform == 'windows'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: '12.9.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cuobjdump", "visual_studio_integration"]'
          log-file-suffix: ofx-win
      - name: Configure and build
        run: |
          extra=()
          [ "${{ matrix.platform }}" = mac ] && extra+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0)
          [ "${{ matrix.platform }}" = windows ] && extra+=(-G "Visual Studio 17 2022" -A x64 -DFE_OFX_WITH_CUDA=ON "-DCMAKE_CUDA_ARCHITECTURES=61-real;75-real;86-real;89-real;89-virtual")
          [ "${{ matrix.platform }}" = windows-arm64ec ] && extra+=(-A ARM64EC -DFE_OFX_WITH_CUDA=OFF)
          cmake -S . -B build-ofx -DCMAKE_BUILD_TYPE=Release -DFE_BUILD_OFX=ON "-DFE_OFX_VERSION=$FE_VERSION" "${extra[@]}"
          cmake --build build-ofx --config Release --parallel
      - name: Test (core + GPU pass emulation + OFX load)
        run: ctest --test-dir build-ofx -C Release --output-on-failure
      - name: Check GPU code in the bundle
        shell: pwsh
        run: |
          if ('${{ matrix.platform }}' -eq 'mac') {
            if (-not (Test-Path build-ofx/FilmEffects.ofx.bundle/Contents/Resources/FilmEffects.metallib)) { throw 'metallib missing' }
          } elseif ('${{ matrix.platform }}' -eq 'windows-arm64ec') {
            $bin = 'build-ofx/FilmEffects.ofx.bundle/Contents/Win-arm64ec/FilmEffects.ofx'
            if (-not (Test-Path $bin)) { throw "Missing $bin" }
            Write-Host 'Arm64EC bundle present (CPU only)'
          } elseif ('${{ matrix.platform }}' -eq 'windows') {
            $bin = 'build-ofx/FilmEffects.ofx.bundle/Contents/Win64/FilmEffects.ofx'
            $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -version '[17.0,18.0)' -latest -property installationPath
            $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            $imports = & $dumpbin.FullName /dependents $bin
            if ($imports -match 'cudart64.*\.dll') { throw 'CUDA runtime must be linked statically' }
            if ($imports -match 'nvcuda\.dll') { throw 'Must not import the NVIDIA driver library' }
            $deviceCode = & "$env:CUDA_PATH/bin/cuobjdump.exe" --list-elf $bin
            if ($LASTEXITCODE -ne 0 -or -not ($deviceCode -match 'sm_61')) { throw 'GTX 1080 (sm_61) device code missing' }
            Write-Host 'CUDA device code present, runtime static'
            Invoke-WebRequest 'https://docs.nvidia.com/cuda/archive/12.9.1/eula/index.html' -OutFile 'build-ofx/NVIDIA-CUDA-EULA.html'
          }
      - name: Package (macOS .pkg)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p ../../out
          bash scripts/package-resolve-macos.sh build-ofx/FilmEffects.ofx.bundle ../../out/FilmEffects-Resolve-mac.pkg "$FE_VERSION"
      - name: Package (Linux .tar.gz)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p ../../out
          cp ../../LICENSE build-ofx/LICENSE.txt
          tar -C build-ofx -czf ../../out/FilmEffects-Resolve-linux.tar.gz FilmEffects.ofx.bundle LICENSE.txt
      - name: Keep Windows bundle for the Setup job
        if: startsWith(matrix.platform, 'windows')
        run: |
          mkdir -p ../../bundle
          cp -R build-ofx/FilmEffects.ofx.bundle ../../bundle/
          cp build-ofx/Release/vv_ofx_load_test.exe ../../bundle/
          if [ -f build-ofx/NVIDIA-CUDA-EULA.html ]; then cp build-ofx/NVIDIA-CUDA-EULA.html ../../bundle/; fi
      - name: Upload Windows bundle
        if: startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: ofx-bundle-${{ matrix.platform }}
          path: bundle
          if-no-files-found: error
      - name: Upload
        if: ${{ !startsWith(matrix.platform, 'windows') }}
        uses: actions/upload-artifact@v4
        with:
          name: FilmEffects-Resolve-${{ matrix.platform }}
          path: out/FilmEffects-Resolve-*
          if-no-files-found: error
  windows-setup:
    # One Setup for every Windows PC: the bundle holds Win64 (x64 + CUDA) and Win-arm64ec; Resolve
    # picks the folder for its own architecture.
    needs: ofx
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ofx-bundle-windows
          path: _x64
      - uses: actions/download-artifact@v4
        with:
          name: ofx-bundle-windows-arm64ec
          path: _arm
      - name: Build Setup
        shell: pwsh
        run: |
          $version = "$((Get-Content VERSION -Raw).Trim()).$env:GITHUB_RUN_NUMBER"
          Copy-Item -Recurse _arm\FilmEffects.ofx.bundle\Contents\Win-arm64ec _x64\FilmEffects.ofx.bundle\Contents\
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed' }
          }
          $root = (Get-Location).Path
          & $iscc "/DAppVersion=$version" "/DBundleDir=$root\_x64\FilmEffects.ofx.bundle" "/DRepoRoot=$root" "/DOutputDir=$root\out" "plugins\film-effects\installer\windows\FilmEffectsResolve.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compile failed' }
      - name: Test Setup on x64 (silent install, load, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${env:CommonProgramFiles}\OFX\Plugins\FilmEffects.ofx.bundle\Contents"
          $p = Start-Process (Resolve-Path out\FilmEffects-Resolve-Windows-Setup.exe) -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "Setup exit code $($p.ExitCode)" }
          foreach ($a in 'Win64', 'Win-arm64ec') { if (-not (Test-Path "$root\$a\FilmEffects.ofx")) { throw "Missing $a\FilmEffects.ofx" } }
          & _x64\vv_ofx_load_test.exe "$root\Win64\FilmEffects.ofx" com.venostavisuals.FilmEffects
          if ($LASTEXITCODE -ne 0) { throw 'Installed x64 bundle failed the load test' }
          Start-Process "$env:ProgramFiles\Venosta Visuals\Film Effects for Resolve\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$root\Win64\FilmEffects.ofx"); $i++) { Start-Sleep 1 }
          if (Test-Path "${env:CommonProgramFiles}\OFX\Plugins\FilmEffects.ofx.bundle") { throw 'Uninstall left the bundle' }
          Write-Host 'x64 Setup test passed'
      - uses: actions/upload-artifact@v4
        with:
          name: FilmEffects-Resolve-windows
          path: out/FilmEffects-Resolve-Windows-Setup.exe
          if-no-files-found: error
  windows-setup-arm:
    needs: windows-setup
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FilmEffects-Resolve-windows
          path: _setup
      - uses: actions/download-artifact@v4
        with:
          name: ofx-bundle-windows-arm64ec
          path: _arm
      - name: Test Setup on Windows on Arm (silent install, Arm64EC load, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "${env:CommonProgramFiles}\OFX\Plugins\FilmEffects.ofx.bundle\Contents\Win-arm64ec\FilmEffects.ofx"
          $p = Start-Process (Resolve-Path _setup\FilmEffects-Resolve-Windows-Setup.exe) -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "Setup exit code $($p.ExitCode)" }
          & _arm\vv_ofx_load_test.exe $bin com.venostavisuals.FilmEffects
          if ($LASTEXITCODE -ne 0) { throw 'Installed Arm64EC bundle failed the load test' }
          Start-Process "$env:ProgramFiles\Venosta Visuals\Film Effects for Resolve\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $bin); $i++) { Start-Sleep 1 }
          if (Test-Path "${env:CommonProgramFiles}\OFX\Plugins\FilmEffects.ofx.bundle") { throw 'Uninstall left the bundle' }
          Write-Host 'Windows-on-Arm Setup test passed'

