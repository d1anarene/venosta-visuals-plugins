name: film-effects-plugins
# Builds the native Film Effects plugins (Film Effects, Film Bloom, Film Halation, Film Grain) for
# macOS and Windows. The Adobe SDKs are NOT in this repository: they are downloaded at build time
# from the private repository d1anarene/vvp-sdk using the ADOBE_SDK_TOKEN secret (ADBE_SDK_TOKEN
# is accepted too), used only on the
# temporary build machine, and never uploaded anywhere. Only the compiled plugins are kept.
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:
    secrets:
      ADOBE_SDK_TOKEN:
        required: false
      ADBE_SDK_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
            cuda: false
          # CUDA 12.x supports VS 2022; avoid the rolling runner's newer VS toolchain.
          - os: windows-2022
            platform: win-cuda
            cuda: true
          # Premiere 26+ runs natively on Windows on Arm: native ARM64 build, CPU only (no CUDA).
          - os: windows-11-arm
            platform: win-arm64
            cuda: false
            arch: ARM64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check SDK access
        id: sdk
        env:
          TOKEN: ${{ secrets.ADOBE_SDK_TOKEN || secrets.ADBE_SDK_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::ADOBE_SDK_TOKEN is not set - skipping the native plugin build."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch Adobe SDKs (private)
        if: steps.sdk.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: d1anarene/vvp-sdk
          token: ${{ secrets.ADOBE_SDK_TOKEN || secrets.ADBE_SDK_TOKEN }}
          path: _sdk_zips
      - name: Unpack SDKs
        if: steps.sdk.outputs.available == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/sdk/ae" "$RUNNER_TEMP/sdk/pr"
          if [ "${{ matrix.platform }}" = mac ]; then ae='*AfterEffects*mac*.zip'; pr='*Premiere*Mac*.zip'; else ae='*AfterEffects*win*.zip'; pr='*Premiere*Windows*.zip'; fi
          unzip -q _sdk_zips/$ae -d "$RUNNER_TEMP/sdk/ae"
          unzip -q _sdk_zips/$pr -d "$RUNNER_TEMP/sdk/pr"
          rm -rf _sdk_zips
          AE=$(dirname "$(dirname "$(find "$RUNNER_TEMP/sdk/ae" -name AE_Effect.h -path '*Examples/Headers/*' | head -1)")")
          PR=$(dirname "$(dirname "$(dirname "$(find "$RUNNER_TEMP/sdk/pr" -name PrSDKAESupport.h -path '*Examples/Headers/*' | head -1)")")")
          echo "AE SDK Examples: $AE"; echo "Premiere SDK: $PR"
          [ -d "$AE/Headers" ] && [ -d "$PR/Examples/Headers" ] || { echo "SDK layout not recognised"; exit 1; }
          if [ "${{ runner.os }}" = Windows ]; then AE=$(cygpath -m "$AE"); PR=$(cygpath -m "$PR"); fi
          echo "AE_SDK=$AE" >> "$GITHUB_ENV"
          echo "PR_SDK=$PR" >> "$GITHUB_ENV"
      - name: Build (macOS, CPU + Metal)
        if: steps.sdk.outputs.available == 'true' && matrix.platform == 'mac'
        working-directory: plugins/film-effects
        run: |
          cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 -DFE_BUILD_PLUGIN=ON -DAE_SDK_DIR="$AE_SDK" -DPR_SDK_DIR="$PR_SDK"
          cmake --build build-mac --config Release --parallel --target FilmEffects FilmBloom FilmHalation FilmGrain
          mkdir -p ../../out/FilmEffects-mac
          find build-mac -maxdepth 3 -name 'Film*.plugin' -exec cp -R {} ../../out/FilmEffects-mac/ \;
          cp scripts/install-mac.command ../../out/FilmEffects-mac/
          bash scripts/package-macos.sh ../../out/FilmEffects-mac ../../out/FilmEffects-mac.pkg "$(tr -d ' \n\r' < ../../VERSION).${GITHUB_RUN_NUMBER}"
          ls -R ../../out/FilmEffects-mac | head -40
      - name: Install Windows CUDA compiler and Visual Studio integration
        if: steps.sdk.outputs.available == 'true' && matrix.cuda == true
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: '12.9.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cuobjdump", "visual_studio_integration"]'
          log-file-suffix: win-cuda
      - name: Show Windows-on-Arm hints in the Adobe SDKs
        if: steps.sdk.outputs.available == 'true' && matrix.platform == 'win-arm64'
        run: |
          for d in "$AE_SDK" "$PR_SDK"; do
            echo "== $d"
            echo "project files mentioning ARM64EC: $(grep -rlis 'ARM64EC' "$d" --include='*.vcxproj' --include='*.sln' --include='*.props' | wc -l)"
            echo "project files mentioning ARM64:   $(grep -rlis 'ARM64' "$d" --include='*.vcxproj' --include='*.sln' --include='*.props' | wc -l)"
            grep -rhois 'Release|ARM64[A-Za-z]*' "$d" --include='*.sln' | sort | uniq -c | head -5 || true
          done
      - name: Build (Windows, CPU or CPU + CUDA)
        if: steps.sdk.outputs.available == 'true' && runner.os == 'Windows'
        shell: pwsh
        working-directory: plugins/film-effects
        run: |
          $cuda = if ('${{ matrix.cuda }}' -eq 'true') { 'ON' } else { 'OFF' }
          $arch = if ('${{ matrix.arch }}') { '${{ matrix.arch }}' } else { 'x64' }
          $configureArgs = @('-S', '.', '-B', 'build-win', '-A', $arch, '-DFE_BUILD_PLUGIN=ON', "-DFE_WITH_CUDA=$cuda", "-DAE_SDK_DIR=$env:AE_SDK", "-DPR_SDK_DIR=$env:PR_SDK")
          if ($cuda -eq 'ON') {
            # Keep the single architecture-list argument inside an array: splatting a
            # scalar string passes its characters individually in PowerShell.
            $configureArgs += @('-G', 'Visual Studio 17 2022', '-DCMAKE_CUDA_ARCHITECTURES=61-real;75-real;86-real;89-real;89-virtual')
          }
          cmake @configureArgs
          if ($LASTEXITCODE -ne 0) { throw 'Windows plugin configuration failed' }
          foreach ($t in "FilmEffects", "FilmBloom", "FilmHalation", "FilmGrain", "fe_aex_load_test") {
            cmake --build build-win --config Release --target $t
            if ($LASTEXITCODE -ne 0) { throw "build of $t failed" }
          }
          $output = '../../out/FilmEffects-${{ matrix.platform }}'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Get-ChildItem -Recurse build-win -Filter "Film*.aex" | Copy-Item -Destination $output
          Copy-Item scripts/install-windows.ps1 $output
          # Load every plug-in like Premiere does, on this machine's architecture (no NVIDIA driver
          # on the build machines: proves the CUDA build also loads on PCs without one).
          & build-win/Release/fe_aex_load_test.exe (Get-ChildItem $output -Filter '*.aex' | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Plug-in load test failed' }
          if ($cuda -eq 'ON') {
            $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -version '[17.0,18.0)' -latest -property installationPath
            $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            foreach ($plugin in Get-ChildItem $output -Filter '*.aex') {
              $exports = & $dumpbin.FullName /exports $plugin.FullName
              if ($LASTEXITCODE -ne 0 -or -not ($exports -match '\bxGPUFilterEntry\b')) { throw "CUDA entry missing: $($plugin.Name)" }
              $imports = & $dumpbin.FullName /dependents $plugin.FullName
              if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $($plugin.Name)" }
              if ($imports -match 'cudart64.*\.dll') { throw 'CUDA runtime must be linked statically' }
              # Must load on PCs without an NVIDIA driver (then Premiere renders on the CPU).
              if ($imports -match 'nvcuda\.dll') { throw 'Must not import the NVIDIA driver library' }
              $deviceCode = & "$env:CUDA_PATH/bin/cuobjdump.exe" --list-elf $plugin.FullName
              if ($LASTEXITCODE -ne 0 -or -not ($deviceCode -match 'sm_61')) { throw "GTX 1080 device code missing: $($plugin.Name)" }
            }
            Invoke-WebRequest 'https://docs.nvidia.com/cuda/archive/12.9.1/eula/index.html' -OutFile "$output/NVIDIA-CUDA-EULA.html"
          }
          Get-ChildItem $output
      - name: Upload plugins
        if: steps.sdk.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FilmEffects-${{ matrix.platform }}
          path: out/FilmEffects-${{ matrix.platform }}
          if-no-files-found: error
      - name: Upload Mac installer
        if: steps.sdk.outputs.available == 'true' && matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: FilmEffects-mac-installer
          path: out/FilmEffects-mac.pkg
          if-no-files-found: error
  windows-installer:
    # One Setup.exe for every Windows PC (CUDA build = CUDA + CPU fallback).
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SDK access
        id: sdk
        shell: bash
        env:
          TOKEN: ${{ secrets.ADOBE_SDK_TOKEN || secrets.ADBE_SDK_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "available=false" >> "$GITHUB_OUTPUT"; else echo "available=true" >> "$GITHUB_OUTPUT"; fi
      - name: Download CUDA build
        if: steps.sdk.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: FilmEffects-win-cuda
          path: _win/cuda
      - name: Download ARM64 build
        if: steps.sdk.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: FilmEffects-win-arm64
          path: _win/arm64
      - name: Build installer (Inno Setup)
        if: steps.sdk.outputs.available == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed' }
          }
          $version = "$((Get-Content VERSION -Raw).Trim()).$env:GITHUB_RUN_NUMBER"
          $root = (Get-Location).Path
          & $iscc "/DAppVersion=$version" "/DCudaDir=$root\_win\cuda" "/DArm64Dir=$root\_win\arm64" "/DRepoRoot=$root" "/DOutputDir=$root\out" "plugins\film-effects\installer\windows\FilmEffects.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compile failed' }
          Get-ChildItem out
      - name: Test installer (silent install, upgrade cleanup, registry folder, uninstall)
        if: steps.sdk.outputs.available == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path out\FilmEffects-Windows-Setup.exe).Path
          $names = 'FilmEffects.aex', 'FilmBloom.aex', 'FilmHalation.aex', 'FilmGrain.aex'
          $fallback = "$env:ProgramFiles\Adobe\Common\Plug-ins\7.0\MediaCore"
          $stray = "$env:ProgramFiles\Adobe\Common\Plugins\7.0\MediaCore"
          $uninst = "$env:ProgramFiles\Venosta Visuals\Film Effects\unins000.exe"
          $key = 'HKLM:\SOFTWARE\Adobe\Premiere Pro\CurrentVersion'
          function Install($log) {
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log; throw "Setup exit code $($p.ExitCode)" }
          }
          function Uninstall($dir) {
            if (-not (Test-Path $uninst)) { throw "Uninstaller missing: $uninst" }
            Start-Process $uninst -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
            for ($i = 0; $i -lt 60 -and (Test-Path "$dir\FilmEffects.aex"); $i++) { Start-Sleep 1 }
            foreach ($n in $names) { if (Test-Path "$dir\$n") { throw "Uninstall left $n" } }
          }
          # 1) Upgrade over a simulated v1.0.6 install in the wrong folder, no Premiere registry value.
          New-Item -ItemType Directory -Force $stray | Out-Null
          foreach ($n in $names + 'unins000.exe', 'unins000.dat') { Set-Content "$stray\$n" 'old' }
          Install "$env:RUNNER_TEMP\setup1.log"
          foreach ($n in $names) { if (-not (Test-Path "$fallback\$n")) { throw "Missing $fallback\$n" } }
          foreach ($n in $names) { if ((Get-FileHash "$fallback\$n").Hash -ne (Get-FileHash "_win\cuda\$n").Hash) { throw "$n is not the x64 CUDA build" } }
          if (Test-Path "$env:ProgramFiles\Adobe\Common\Plugins") { Get-ChildItem -Recurse "$env:ProgramFiles\Adobe\Common\Plugins"; throw 'Stray Common\Plugins folder not removed' }
          Uninstall $fallback
          # 2) Folder taken from Premiere's Plug-InsDir registry value.
          $custom = 'C:\FE-Test\MediaCore'
          New-Item -ItemType Directory -Force $custom | Out-Null
          New-Item -Force $key | Out-Null
          New-ItemProperty -Force $key -Name 'Plug-InsDir' -Value "$custom\" | Out-Null
          Install "$env:RUNNER_TEMP\setup2.log"
          foreach ($n in $names) { if (-not (Test-Path "$custom\$n")) { Get-Content "$env:RUNNER_TEMP\setup2.log"; throw "Missing $custom\$n" } }
          Uninstall $custom
          Remove-Item -Recurse -Force 'HKLM:\SOFTWARE\Adobe\Premiere Pro'
          Write-Host 'Installer tests passed'
      - name: Upload Windows installer
        if: steps.sdk.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FilmEffects-windows-installer
          path: out/FilmEffects-Windows-Setup.exe
          if-no-files-found: error
  windows-installer-arm:
    # The same Setup on a Windows-on-Arm machine must install the ARM64 plug-ins.
    needs: [build, windows-installer]
    runs-on: windows-11-arm
    steps:
      - name: Check SDK access
        id: sdk
        shell: bash
        env:
          TOKEN: ${{ secrets.ADOBE_SDK_TOKEN || secrets.ADBE_SDK_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "available=false" >> "$GITHUB_OUTPUT"; else echo "available=true" >> "$GITHUB_OUTPUT"; fi
      - name: Download installer
        if: steps.sdk.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: FilmEffects-windows-installer
          path: _setup
      - name: Download ARM64 build
        if: steps.sdk.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: FilmEffects-win-arm64
          path: _arm64
      - name: Install silently and compare with the ARM64 build
        if: steps.sdk.outputs.available == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path _setup\FilmEffects-Windows-Setup.exe).Path
          $dir = "$env:ProgramFiles\Adobe\Common\Plug-ins\7.0\MediaCore"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "Setup exit code $($p.ExitCode)" }
          foreach ($f in Get-ChildItem _arm64 -Filter '*.aex') {
            $installed = Join-Path $dir $f.Name
            if (-not (Test-Path $installed)) { throw "Missing $installed" }
            if ((Get-FileHash $installed).Hash -ne (Get-FileHash $f.FullName).Hash) { throw "$($f.Name) is not the ARM64 build" }
          }
          Start-Process "$env:ProgramFiles\Venosta Visuals\Film Effects\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\FilmEffects.aex"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\FilmEffects.aex") { throw 'Uninstall left the plug-ins' }
          Write-Host 'ARM64 installer test passed'
