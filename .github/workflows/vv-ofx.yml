name: vv-ofx
# Reusable: builds one plugin's OpenFX bundle (DaVinci Resolve) with the shared engine adapter for
# macOS (universal, Metal when the plugin has it), Windows x64 (CUDA optional), Windows on Arm
# (Arm64EC, CPU) and Linux x86-64 (CPU). No Adobe SDK needed (BSD OpenFX SDK fetched by CMake).
# Checks: the plugin's own tests, loading the bundle like an OFX host, installer silent install/
# uninstall on x64 and Arm machines. Not a test inside DaVinci Resolve.
#
# Release files (artifacts "release-<bundle>-resolve-<platform>"):
#   <bundle>-Resolve-mac.pkg, <bundle>-Resolve-Windows-Setup.exe, <bundle>-Resolve-linux.tar.gz
on:
  workflow_call:
    inputs:
      plugin:       { type: string, required: true }   # folder under plugins/
      bundle:       { type: string, required: true }   # <bundle>.ofx.bundle
      ofx_id:       { type: string, required: true }   # expected OpenFX identifier
      cmake_flags:  { type: string, required: true }   # e.g. -DFE_BUILD_OFX=ON
      cuda:         { type: boolean, default: false }
      metal:        { type: boolean, default: false }
      mac_pkg_id:   { type: string, required: true }
      iss:          { type: string, required: true }   # plugin's Inno Setup script
      name:         { type: string, required: true }   # display name (uninstaller folder)
permissions:
  contents: read
jobs:
  ofx:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: mac }
          # CUDA 12.x supports VS 2022; avoid the rolling runner's newer VS toolchain.
          - { os: windows-2022, platform: windows }
          # Resolve on Windows on Arm is an Arm64EC host (OpenFX 1.5): Contents/Win-arm64ec, CPU.
          - { os: windows-11-arm, platform: windows-arm64ec }
          - { os: ubuntu-latest, platform: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: plugins/${{ inputs.plugin }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VV_VERSION=$(tr -d ' \n\r' < ../../VERSION).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Install CUDA compiler (Windows x64)
        if: matrix.platform == 'windows' && inputs.cuda
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: '12.9.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cuobjdump", "visual_studio_integration"]'
          log-file-suffix: ${{ inputs.bundle }}-ofx
      - name: Configure and build
        run: |
          extra=()
          [ "${{ matrix.platform }}" = mac ] && extra+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0)
          if [ "${{ matrix.platform }}" = windows ]; then
            extra+=(-G "Visual Studio 17 2022" -A x64)
            if [ "${{ inputs.cuda }}" = true ]; then
              extra+=(-DVV_WITH_CUDA=ON "-DCMAKE_CUDA_ARCHITECTURES=61-real;75-real;86-real;89-real;89-virtual")
            else
              extra+=(-DVV_WITH_CUDA=OFF)
            fi
          fi
          [ "${{ matrix.platform }}" = windows-arm64ec ] && extra+=(-A ARM64EC -DVV_WITH_CUDA=OFF)
          cmake -S . -B build-ofx -DCMAKE_BUILD_TYPE=Release ${{ inputs.cmake_flags }} "-DVV_VERSION=$VV_VERSION" "${extra[@]}"
          cmake --build build-ofx --config Release --parallel
      - name: Test (plugin tests + OFX load)
        run: ctest --test-dir build-ofx -C Release --output-on-failure
      - name: Check GPU code in the bundle
        shell: pwsh
        run: |
          $bundle = 'build-ofx/${{ inputs.bundle }}.ofx.bundle'
          if ('${{ matrix.platform }}' -eq 'mac' -and '${{ inputs.metal }}' -eq 'true') {
            if (-not (Get-ChildItem "$bundle/Contents/Resources" -Filter '*.metallib' -ErrorAction SilentlyContinue)) { throw 'metallib missing' }
          } elseif ('${{ matrix.platform }}' -eq 'windows-arm64ec') {
            if (-not (Test-Path "$bundle/Contents/Win-arm64ec/${{ inputs.bundle }}.ofx")) { throw 'Arm64EC binary missing' }
          } elseif ('${{ matrix.platform }}' -eq 'windows' -and '${{ inputs.cuda }}' -eq 'true') {
            $bin = "$bundle/Contents/Win64/${{ inputs.bundle }}.ofx"
            $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -version '[17.0,18.0)' -latest -property installationPath
            $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            $imports = & $dumpbin.FullName /dependents $bin
            if ($imports -match 'cudart64.*\.dll') { throw 'CUDA runtime must be linked statically' }
            if ($imports -match 'nvcuda\.dll') { throw 'Must not import the NVIDIA driver library' }
            $deviceCode = & "$env:CUDA_PATH/bin/cuobjdump.exe" --list-elf $bin
            if ($LASTEXITCODE -ne 0 -or -not ($deviceCode -match 'sm_61')) { throw 'GTX 1080 (sm_61) device code missing' }
            Invoke-WebRequest 'https://docs.nvidia.com/cuda/archive/12.9.1/eula/index.html' -OutFile 'build-ofx/NVIDIA-CUDA-EULA.html'
            Write-Host 'CUDA device code present, runtime static'
          }
      - name: Package (macOS .pkg)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p ../../out
          metal=""; [ "${{ inputs.metal }}" = true ] && metal="--metal"
          bash ../../shared/engine/installer/macos/package-ofx.sh build-ofx/${{ inputs.bundle }}.ofx.bundle \
            "../../out/${{ inputs.bundle }}-Resolve-mac.pkg" "$VV_VERSION" "${{ inputs.mac_pkg_id }}" $metal
      - name: Package (Linux .tar.gz)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p ../../out
          cp ../../LICENSE build-ofx/LICENSE.txt
          tar -C build-ofx -czf "../../out/${{ inputs.bundle }}-Resolve-linux.tar.gz" ${{ inputs.bundle }}.ofx.bundle LICENSE.txt
      - name: Keep Windows bundle for the Setup job
        if: startsWith(matrix.platform, 'windows')
        run: |
          mkdir -p ../../bundle
          cp -R build-ofx/${{ inputs.bundle }}.ofx.bundle ../../bundle/
          cp build-ofx/Release/vv_ofx_load_test.exe ../../bundle/
          if [ -f build-ofx/NVIDIA-CUDA-EULA.html ]; then cp build-ofx/NVIDIA-CUDA-EULA.html ../../bundle/; fi
      - name: Upload Windows bundle
        if: startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.bundle }}-resolve-${{ matrix.platform }}
          path: bundle
          if-no-files-found: error
      - name: Upload release file
        if: ${{ !startsWith(matrix.platform, 'windows') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.bundle }}-resolve-${{ matrix.platform }}
          path: out/${{ inputs.bundle }}-Resolve-*
          if-no-files-found: error

  windows-setup:
    # One Setup for every Windows PC: Contents/Win64 (x64) + Contents/Win-arm64ec; Resolve picks.
    needs: ofx
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ inputs.bundle }}-resolve-windows
          path: _x64
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ inputs.bundle }}-resolve-windows-arm64ec
          path: _arm
      - name: Build Setup
        shell: pwsh
        run: |
          $version = "$((Get-Content VERSION -Raw).Trim()).$env:GITHUB_RUN_NUMBER"
          Copy-Item -Recurse _arm\${{ inputs.bundle }}.ofx.bundle\Contents\Win-arm64ec _x64\${{ inputs.bundle }}.ofx.bundle\Contents\
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed' }
          }
          $root = (Get-Location).Path
          & $iscc "/DAppVersion=$version" "/DBundleDir=$root\_x64\${{ inputs.bundle }}.ofx.bundle" "/DRepoRoot=$root" "/DOutputDir=$root\out" "${{ inputs.iss }}"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compile failed' }
      - name: Test Setup on x64 (silent install, load, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${env:CommonProgramFiles}\OFX\Plugins\${{ inputs.bundle }}.ofx.bundle\Contents"
          $p = Start-Process (Resolve-Path out\${{ inputs.bundle }}-Resolve-Windows-Setup.exe) -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "Setup exit code $($p.ExitCode)" }
          foreach ($a in 'Win64', 'Win-arm64ec') { if (-not (Test-Path "$root\$a\${{ inputs.bundle }}.ofx")) { throw "Missing $a\${{ inputs.bundle }}.ofx" } }
          & _x64\vv_ofx_load_test.exe "$root\Win64\${{ inputs.bundle }}.ofx" '${{ inputs.ofx_id }}'
          if ($LASTEXITCODE -ne 0) { throw 'Installed x64 bundle failed the load test' }
          Start-Process "$env:ProgramFiles\Venosta Visuals\${{ inputs.name }} for Resolve\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$root\Win64\${{ inputs.bundle }}.ofx"); $i++) { Start-Sleep 1 }
          if (Test-Path "${env:CommonProgramFiles}\OFX\Plugins\${{ inputs.bundle }}.ofx.bundle") { throw 'Uninstall left the bundle' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.bundle }}-resolve-windows
          path: out/${{ inputs.bundle }}-Resolve-Windows-Setup.exe
          if-no-files-found: error

  windows-setup-arm:
    needs: windows-setup
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.bundle }}-resolve-windows
          path: _setup
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ inputs.bundle }}-resolve-windows-arm64ec
          path: _arm
      - name: Test Setup on Windows on Arm (silent install, Arm64EC load, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "${env:CommonProgramFiles}\OFX\Plugins\${{ inputs.bundle }}.ofx.bundle\Contents\Win-arm64ec\${{ inputs.bundle }}.ofx"
          $p = Start-Process (Resolve-Path _setup\${{ inputs.bundle }}-Resolve-Windows-Setup.exe) -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "Setup exit code $($p.ExitCode)" }
          & _arm\vv_ofx_load_test.exe $bin '${{ inputs.ofx_id }}'
          if ($LASTEXITCODE -ne 0) { throw 'Installed Arm64EC bundle failed the load test' }
          Start-Process "$env:ProgramFiles\Venosta Visuals\${{ inputs.name }} for Resolve\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $bin); $i++) { Start-Sleep 1 }
          if (Test-Path "${env:CommonProgramFiles}\OFX\Plugins\${{ inputs.bundle }}.ofx.bundle") { throw 'Uninstall left the bundle' }
