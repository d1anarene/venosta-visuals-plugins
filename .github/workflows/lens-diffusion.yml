name: lens-diffusion
# Lens & Diffusion for Premiere Pro and DaVinci Resolve, built and tested with the shared workflows.
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:
    secrets:
      ADOBE_SDK_TOKEN: { required: false }
      ADBE_SDK_TOKEN: { required: false }
permissions:
  contents: read
# Pushes to dev: a newer push supersedes older runs. Never cancels on main (release builds call this
# workflow; the group name includes the plugin so plugins do not cancel each other).
concurrency:
  group: lens-diffusion-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  premiere:
    uses: ./.github/workflows/vv-premiere.yml
    secrets: inherit
    with:
      plugin: lens-diffusion
      binary: LensDiffusion
      name: Lens & Diffusion
      cmake_flags: -DLD_BUILD_PLUGIN=ON
      cuda: true
      metal: true
      mac_pkg_id: com.venostavisuals.lensdiffusion
      iss: plugins/lens-diffusion/installer/windows/LensDiffusion.iss
  resolve:
    uses: ./.github/workflows/vv-ofx.yml
    with:
      plugin: lens-diffusion
      bundle: LensDiffusion
      name: Lens & Diffusion
      ofx_id: com.venostavisuals.LensDiffusion
      cmake_flags: -DLD_BUILD_OFX=ON
      cuda: true
      metal: true
      mac_pkg_id: com.venostavisuals.lensdiffusion.resolve
      iss: plugins/lens-diffusion/installer/windows/LensDiffusionResolve.iss
